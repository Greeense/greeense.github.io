<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffd27a">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대만여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>대만 3박 4일 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 노랑→분홍 그라데이션 헤더 카드 + 알약 탭, 아래 세로 타임라인 위 둥근 카드(장소)와 점선 이동 칸 */
:root{
  --bg:#fff9ea; --card:#ffffff; --fg:#43283a; --muted:#9a7487; --line:#f7d6e2;
  --accent:#f0628f; --accent-2:#ffc93c; --accent-fg:#ffffff; --soft:#fff0f5;
  --hero-a:#ffe27a; --hero-b:#ffb3cb; --hero-fg:#4a2338; --glass:rgba(255,255,255,.62);
  --dot-move:#6b4359; --dot-food:#f0628f; --dot-sight:#ffc22e; --dot-stay:#8f9cf0; --dot-shop:#d084e6;
  --tint-move:#f6eaf0; --tint-food:#ffe4ee; --tint-sight:#fff2c2; --tint-stay:#e9ecff; --tint-shop:#f7e6fc;
  --warn:#d23d6c; --warn-bg:#ffe4ee; --past-card:#f3ead6; --now-bg:#ffe3ec; --shadow:0 6px 18px -10px rgba(214,90,135,.45);
  --f-display:"Jua","Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1519; --card:#2b1f26; --fg:#fdeff4; --muted:#c7a5b6; --line:#4b3341;
  --accent:#ff8fb4; --accent-2:#ffd45e; --accent-fg:#2a0f1c; --soft:#36232d;
  --hero-a:#5a4416; --hero-b:#5c2740; --hero-fg:#fff3f7; --glass:rgba(30,18,24,.45);
  --dot-move:#e9cfdc; --dot-food:#ff8fb4; --dot-sight:#ffd45e; --dot-stay:#a8b2f7; --dot-shop:#e2a6f2;
  --tint-move:#3a2a33; --tint-food:#4a2234; --tint-sight:#45391a; --tint-stay:#2b2e4a; --tint-shop:#3e2648;
  --warn:#ffa3c2; --warn-bg:#4a2234; --past-card:#18110f; --now-bg:#45253a; --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1519; --card:#2b1f26; --fg:#fdeff4; --muted:#c7a5b6; --line:#4b3341;
  --accent:#ff8fb4; --accent-2:#ffd45e; --accent-fg:#2a0f1c; --soft:#36232d;
  --hero-a:#5a4416; --hero-b:#5c2740; --hero-fg:#fff3f7; --glass:rgba(30,18,24,.45);
  --dot-move:#e9cfdc; --dot-food:#ff8fb4; --dot-sight:#ffd45e; --dot-stay:#a8b2f7; --dot-shop:#e2a6f2;
  --tint-move:#3a2a33; --tint-food:#4a2234; --tint-sight:#45391a; --tint-stay:#2b2e4a; --tint-shop:#3e2648;
  --warn:#ffa3c2; --warn-bg:#4a2234; --past-card:#18110f; --now-bg:#45253a; --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 헤더 */
.top{position:relative;z-index:5;background:var(--bg);padding-block:12px 8px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 16px 14px;color:var(--hero-fg);
  background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--glass);pointer-events:none}
.hero::before{width:120px;height:120px;right:-40px;top:-50px;opacity:.5}
.hero::after{width:60px;height:60px;left:46%;bottom:-34px;opacity:.45}
.hd{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hd-l{min-width:0}
.kicker{font-size:12px;letter-spacing:.06em;opacity:.8}
.dayno{font-family:var(--f-display);font-size:34px;line-height:1.05;margin-top:2px}
.dayno small{font-size:18px;margin-left:2px}
.date{font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clock-pill{display:inline-flex;align-items:center;gap:4px;background:var(--glass);border-radius:999px;padding:1px 9px;font-weight:700}
.clock-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dayline{margin-top:14px;padding-bottom:8px;border-bottom:1px dotted var(--line);font-size:13px;color:var(--muted)}
.dayline b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--fg);margin-right:6px}
.wx{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.wx-chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:0;border-radius:16px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;color:var(--hero-fg);backdrop-filter:blur(6px)}
.wx-chip svg{width:30px;height:30px;flex:none}
.wx-city{font-size:11px;line-height:1.2;opacity:.85}
.wx-t{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;font-family:var(--f-display)}
.wx-now{font-size:22px}
.wx-lh{font-size:12px;opacity:.8}
.wx-note{font-size:10.5px;text-align:right;opacity:.85}
.wx-note a{font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:none;border-radius:999px;padding:6px 2px;cursor:pointer;line-height:1.15}
.tab b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px}
.tab span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tab[aria-selected="true"] span{color:inherit;opacity:.9}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* 날씨 편집 */
.wxed{background:var(--card);border-radius:18px;padding:14px;margin-top:10px;display:grid;gap:12px;box-shadow:var(--shadow)}
.wxed-row{display:grid;gap:6px}
.wxed-row h4{margin:0;font-size:13px;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.temps{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.temps label{display:flex;align-items:center;gap:6px}
.temps input{width:60px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;font-variant-numeric:tabular-nums}
.wxed-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.btn-sm{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}

/* 타임라인 */
.tl{position:relative;z-index:0;margin-top:10px;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:14px;bottom:14px;width:0;border-left:3px dotted var(--line)}
.stop{position:relative;padding-block:6px}
.dot{position:absolute;left:-28px;top:22px;width:18px;height:18px;border-radius:50%;border:4px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.k-move .dot{background:var(--dot-move)} .k-food .dot{background:var(--dot-food)} .k-sight .dot{background:var(--dot-sight)}
.k-stay .dot{background:var(--dot-stay)} .k-shop .dot{background:var(--dot-shop)}
.card{background:var(--card);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:var(--shadow)}
.s-head{display:flex;align-items:flex-start;gap:10px}
.s-main{flex:1;min-width:0}
.s-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.s-time{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums}
.kpill{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:500}
.k-move .kpill{background:var(--tint-move)} .k-food .kpill{background:var(--tint-food)} .k-sight .kpill{background:var(--tint-sight)}
.k-stay .kpill{background:var(--tint-stay)} .k-shop .kpill{background:var(--tint-shop)}
.s-name{font-family:var(--f-display);font-size:19px;line-height:1.3;margin-top:3px;text-wrap:balance}
.s-sub{font-size:12px;color:var(--muted)}
.s-note{font-size:13px;color:var(--muted);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.maplink{flex:none;display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 11px 0 9px;border-radius:999px;
  background:var(--soft);color:var(--accent);text-decoration:none;font-size:12px;font-weight:700}
.maplink svg{width:14px;height:14px}
.s-act{flex:none;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.s-act .maplink{justify-content:center}
.maplink.go{background:var(--accent);color:var(--accent-fg)}
.locrow{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.loc-btn{display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:4px 11px 4px 8px;background:var(--glass);color:var(--hero-fg);font-weight:700;cursor:pointer;font-size:12.5px}
.loc-btn svg{width:14px;height:14px}
#loctxt{min-width:0;opacity:.9}
.extras{margin-top:10px;display:grid;gap:6px}
.ex{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;text-decoration:none;background:var(--bg)}
.ex .ex-k{flex:none;width:8px;height:8px;border-radius:50%}
.ex .ex-t{flex:1;min-width:0;font-size:13.5px}
.ex .ex-d{display:block;font-size:11.5px;color:var(--muted)}
.ex .arrow{flex:none;color:var(--accent);font-size:12px;font-weight:700}
.ex-label{font-size:11px;color:var(--muted);letter-spacing:.06em}

/* 이동 */
.tr{position:relative;padding-block:2px}
.tr-btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--card);border:1px dashed var(--line);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;text-align:left;color:var(--muted);font-size:12.5px}
.tr-btn svg.mode{width:18px;height:18px;flex:none;color:var(--accent)}
.tr-btn .tr-txt{min-width:0}
.tr-btn .tr-txt b{color:var(--fg);font-weight:500}
.tr-btn .chev{flex:none;transition:transform .2s;color:var(--accent);display:flex}
.tr-btn[aria-expanded="true"]{border-style:solid;border-color:var(--accent)}
.tr-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tr-static{display:inline-flex;align-items:center;gap:6px;padding:5px 4px;color:var(--muted);font-size:12.5px}
.tr-static svg{width:18px;height:18px;color:var(--accent)}
.tr-panel{background:var(--soft);border-radius:16px;padding:12px;margin:6px 0 4px;display:grid;gap:10px}
.gm{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-fg);text-decoration:none;border-radius:999px;padding:10px;font-weight:700}
.gm svg{width:16px;height:16px}
.strip{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:13px}
.strip .sd{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);background:var(--card)}
.strip .sd.end{background:var(--accent-2);border-color:var(--accent-2)}
.strip .sl{width:0;height:14px;border-left:2px dotted var(--accent);margin-left:5px}
.tip{font-size:12px;color:var(--muted)}

/* 지난 일정 / 지금 */
.past .card{background:var(--past-card);box-shadow:none}
.past .card>*{opacity:.5}
.past .dot{background:var(--muted)!important}
.tr.past{opacity:.45}
.now-badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.now .card{background:var(--now-bg);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.now .ex{background:var(--card)}
.now .dot{box-shadow:0 0 0 2px var(--accent),0 0 0 7px var(--soft)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);display:grid;gap:4px}
/* 숫자 칸의 위아래 화살표 숨기기 (폰에선 숫자 키패드만 뜸) */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
/* 공금 */
#potbox{position:relative;display:grid;margin-top:16px}
.pot{position:relative;margin-top:0;background:var(--glass);border-radius:14px;padding:9px 12px;display:grid;gap:6px}
.pot-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pot-lbl{font-size:12px;opacity:.85}
.pot-left{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.pot-left.neg{color:var(--warn)}
.pot-sub{font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.pot-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden}
.pot-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pot-edit{border:0;background:none;color:var(--hero-fg);font-weight:700;font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.pot-form{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.pot-form input{width:70px;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-variant-numeric:tabular-nums}
.pot-start{border:0;border-radius:999px;padding:6px 12px;background:var(--glass);color:var(--hero-fg);font-weight:700;cursor:pointer;font-size:12.5px;justify-self:start}
/* 금액 입력 · 정산 */
.money{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dotted var(--line);font-size:12.5px;color:var(--muted)}
.money input,.money select,.st-in,.st-sel{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.money{display:grid!important;gap:6px}
.money-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.money-sum{color:var(--accent);font-weight:700}
.money-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px;border-radius:12px;background:var(--soft)}
.money-row input,.money-row select{background:var(--card)}
.money-row input[type=number]{width:90px;font-variant-numeric:tabular-nums}
.money .money-memo{flex:1 1 110px;min-width:0}
.money-line{display:flex;align-items:center;gap:8px}
.m-lab{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px}
.m-lab svg{width:15px;height:15px}
.m-add{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:4px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:17px;line-height:1;cursor:pointer;padding:0}
.m-del{font-size:18px;line-height:1}
.money-tog{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:left}
.money-tog svg{width:15px;height:15px}
.money-tog .money-sum{flex:1;text-align:right}
.money-tog .chev{display:flex;color:var(--accent);transition:transform .2s}
.money-tog[aria-expanded="true"] .chev{transform:rotate(180deg)}
.money-body{display:grid;gap:6px}
.money-add{justify-self:start;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:12px}
.money .won{font-size:11.5px}
.tr-panel .money{margin-top:0;border-top:0;padding-top:0}
.amt-badge{color:var(--accent);font-weight:700}
.settle{margin-top:22px;display:grid;gap:12px}
.settle-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:16px;padding:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-fg);font-family:var(--f-display);font-size:19px;box-shadow:var(--shadow)}
.st-panel{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:grid;gap:16px}
.st-sec{display:grid;gap:8px}
.st-sec h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.st-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.st-row .st-in{min-width:0}
.st-name{width:96px}
.st-num{width:96px;font-variant-numeric:tabular-nums}
.st-grow{flex:1 1 120px}
.st-exrow .st-grow{flex-basis:100%}
.st-x{border:0;background:var(--soft);color:var(--accent);border-radius:8px;width:28px;height:28px;cursor:pointer}
.st-add{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;justify-self:start}
.st-total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px}
.st-total b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.st-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.st-table th,.st-table td{padding:6px 4px;border-bottom:1px dotted var(--line);text-align:right}
.st-table th:first-child,.st-table td:first-child{text-align:left}
.st-table th{font-weight:500;color:var(--muted);font-size:12px}
.plus{color:#2f8f5b} .minus{color:var(--warn)}
.st-send{display:grid;gap:6px}
.st-send div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
.st-send b{color:var(--accent)}
.st-foot{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
.st-note{font-size:12px;color:var(--muted)}
.copy{margin-top:32px;padding-top:14px;border-top:1px dotted var(--line);text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
@media (prefers-reduced-motion: reduce){.tr-btn .chev{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="hero">
    <div class="hd">
      <div class="hd-l">
        <div class="kicker">TAIWAN 3박 4일 · 11/12 ~ 11/15</div>
        <div class="dayno" id="dayno"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="wx" id="wx"></div>
    </div>
    <div class="locrow"><button class="loc-btn" id="locbtn" type="button"></button><span id="loctxt"></span></div>

function autoCity(){ // 일정 기준으로 지금 있을 도시

  if(n.iso==="2026-11-12")return n.min>=10*60?"타이베이":"서울";

async function fetchNow(city,force){
  const old=NOW[city]; if(!force&&old&&Date.now()-old.t<15*60*1000)return;
  try{
    const c=coordsOf(city); if(!c)throw 0;
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
    const r=await fetch(url); if(!r.ok)throw 0; const j=await r.json();
    NOW[city]={t:Date.now(),temp:Math.round(j.current.temperature_2m),w:codeToW(j.current.weather_code),
      lo:Math.round(j.daily.temperature_2m_min[0]),hi:Math.round(j.daily.temperature_2m_max[0]),
      pop:j.daily.precipitation_probability_max?j.daily.precipitation_probability_max[0]:null};

}

async function placeName(lat,lon){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`);
    if(!r.ok)throw 0; const d=await r.json();
    const parts=[d.city||d.principalSubdivision,d.locality].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
    if(parts.length)return parts.join(" ");
  }catch(e){}
  return `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
}
function getLoc(silent){
  if(!navigator.geolocation){locMsg="이 브라우저는 위치를 못 받아요";renderLoc();return}
  if(!silent){locMsg="위치 찾는 중…";renderLoc();}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    const name=await placeName(lat,lon);
    MYLOC={lat,lon,name,t:Date.now()}; store.set("tw-loc",MYLOC);
    locMsg=""; cityPick=null; delete NOW[ME]; renderWx(); fetchNow(ME,true);
  },err=>{
    if(silent)return;
    locMsg=err.code===1?"위치 허용이 꺼져 있어요 · 브라우저 설정에서 허용해 주세요":"위치를 못 찾았어요 · 파일을 브라우저로 열었는지 확인해 주세요";
    renderLoc();
  },{enableHighAccuracy:false,timeout:15000,maximumAge:5*60*1000});
}

function nowInfo(){const n=new Date();return{iso:n.getFullYear()+"-"+p2(n.getMonth()+1)+"-"+p2(n.getDate()),min:n.getHours()*60+n.getMinutes(),hm:p2(n.getHours())+":"+p2(n.getMinutes())}}
const APPROX={"아침":480,"오전":600,"점심":720,"저녁":1080,"밤":1260};
/* 각 칸이 지난 일정인지 계산: 시작한 장소 중 마지막 = 지금, 그 앞 = 지난 일정 */
function statusOf(d){
  const nw=nowInfo(); const st=d.items.map(()=>"");
  if(d.date<nw.iso) return st.map(()=>"past");
  if(d.date>nw.iso) return st;
  let prev=0; const eff=d.items.map(it=>{if(it.tr)return null;const m=/^(\d{1,2}):(\d{2})$/.exec(it.t||"");let v=m?(+m[1])*60+(+m[2]):(APPROX[it.t]??prev+30);v=Math.max(v,prev);prev=v;return v});
  let curI=-1; d.items.forEach((it,i)=>{if(!it.tr&&eff[i]<=nw.min)curI=i});
  d.items.forEach((it,i)=>{
    if(!it.tr){ if(i<curI)st[i]="past"; else if(i===curI)st[i]="now"; }
    else { let j=i+1; while(j<d.items.length&&d.items[j].tr)j++; if(j<=curI)st[i]="past"; }
  });
  return st;
}

function sumText(k){const L=listOf(k).filter(e=>+e.amt>0);if(!L.length)return "";const t=sumOf(k);return `${fmt(t)}달러${L.length>1?` · ${L.length}건`:""} (≈ ${won(t)}원)`}
function updSum(k){const el=document.querySelector(`[data-msum="${k}"]`);if(!el)return;const box=el.closest("[data-mbox]");el.textContent=sumText(k)||(box&&box.dataset.mfold==="1"?"적기":"")}
function rerenderMoney(key){const box=document.querySelector(`[data-mbox="${key}"]`);if(!box)return;const tmp=document.createElement("div");tmp.innerHTML=moneyRow(key,box.dataset.mlabel,box.dataset.mfold==="1");box.replaceWith(tmp.firstElementChild)}
const slot=(id,make)=>{const [k,j]=id.split("|");if(!Array.isArray(M.items[k]))M.items[k]=[];const L=M.items[k];while(L.length<=+j&&make)L.push({amt:"",payer:defPayer(),memo:""});return {k,e:L[+j]}};
function allEntries(){
  const out=[];
  DAYS.forEach(d=>d.items.forEach((it,i)=>{if(it.k==="stay")return;listOf(d.n+"-"+i).forEach(v=>{if(+v.amt>0)out.push({day:d.n,name:(it.tr?`${ML[it.tr]}${it.dL?" → "+it.dL:""}`:it.name)+(v.memo?` (${v.memo})`:""),amt:+v.amt,payer:+(v.payer??defPayer())})})}));
  M.extra.forEach(x=>{if(+x.amt>0)out.push({day:0,name:x.name||"기타",amt:+x.amt,payer:+(x.payer??defPayer())})});
  return out.map(e=>Object.assign(e,{payer:e.payer===POT||e.payer<M.members.length?e.payer:0}));
}
function potInfo(){
  const rate=+M.rate||1; const n=+M.pot.n||M.members.length||1;
  const krw=(+M.pot.per||0)*10000*n; const twd=krw/rate;
  const spent=allEntries().filter(e=>e.payer===POT).reduce((a,e)=>a+e.amt,0);
  return {n,krw,twd,spent,left:twd-spent};
}
function renderPot(){
  const box=$("potbox"); if(!box)return;
  if(potEditing){
    box.innerHTML=`<div class="pot"><div class="pot-lbl">공금 (각자 걷은 돈)</div><div class="pot-form">1인당 <input id="potper" type="number" inputmode="decimal" min="0" value="${esc(M.pot.per)}" aria-label="1인당 금액(만원)"> 만원 × <input id="potn" type="number" inputmode="numeric" min="1" value="${esc(M.pot.n)}" aria-label="인원"> 명 <button class="btn-sm" id="potdone">저장</button></div></div>`;
    return;
  }
  if(!potOn()){box.innerHTML=`<button class="pot-start" id="potedit">+ 공금 입력하기 (1인당 ○만원)</button>`;return}
  const p=potInfo(); const pct=p.twd>0?Math.max(0,Math.min(100,p.left/p.twd*100)):0;
  box.innerHTML=`<div class="pot"><div class="pot-top"><span class="pot-lbl">공금 남은 돈</span><button class="pot-edit" id="potedit">수정</button></div>
  <div class="pot-top"><span class="pot-left${p.left<0?" neg":""}">${fmt(p.left)}<small style="font-size:14px">달러</small></span><span class="pot-sub">≈ ${won(p.left)}원</span></div>
  <div class="pot-bar" role="img" aria-label="공금 ${Math.round(pct)}% 남음"><i style="width:${pct}%"></i></div>
  <div class="pot-sub">${+M.pot.per}만원 × ${p.n}명 = ${fmt(p.krw)}원 (${fmt(p.twd)}달러) 중 ${fmt(p.spent)}달러 씀</div></div>`;
}
function settleCalc(){
  const all=allEntries(); const es=all.filter(e=>e.payer!==POT); const n=M.members.length||1;
  const total=es.reduce((a,e)=>a+e.amt,0); const share=total/n;
  const p=potInfo();
  const paid=M.members.map((_,i)=>es.filter(e=>e.payer===i).reduce((a,e)=>a+e.amt,0));
  const bal=paid.map(p=>p-share);
  const cr=bal.map((b,i)=>({i,b})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const db=bal.map((b,i)=>({i,b:-b})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const tx=[]; let ci=0,di=0;
  while(ci<cr.length&&di<db.length){const v=Math.min(cr[ci].b,db[di].b);tx.push({from:db[di].i,to:cr[ci].i,v});cr[ci].b-=v;db[di].b-=v;if(cr[ci].b<=0.5)ci++;if(db[di].b<=0.5)di++;}
  const byDay=[1,2,3,4,0].map(k=>({k,s:all.filter(e=>e.day===k).reduce((a,e)=>a+e.amt,0)}));
  return {es,all,total,share,paid,bal,tx,byDay,p};
}

    </div>`;
  }

function renderStRes(){
